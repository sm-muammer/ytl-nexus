# YTL Nexus on Nexus Core 01: the only public web entry point.
# Installed as /etc/httpd/conf.d/00-ytl-nexus.conf by `setup-apache`.
# Requirements 4.17 to 4.20. Documented in docs/operations/server-baseline.md.

ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None

# No directory listing anywhere (requirement 4.18).
<Directory "/">
    Options -Indexes
</Directory>
<Directory "/var/www">
    Options -Indexes
    AllowOverride None
</Directory>

Listen 443 https
SSLProtocol             -all +TLSv1.2 +TLSv1.3
SSLHonorCipherOrder     off
SSLSessionTickets       off
SSLSessionCache         "shmcb:/run/httpd/sslcache(512000)"
SSLSessionCacheTimeout  300

# ---- Port 80: redirect everything to HTTPS (requirement 4.18) -----------------
# Only the four known names are echoed back, so a forged Host header cannot
# turn the redirect into an open redirector.
<VirtualHost *:80>
    ServerName ytl-nexus.ytlcomms.my
    ServerAlias ytl-nexus.internal sn1lyvx1d0002.ytlcomms.my 10.26.64.164

    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^(ytl-nexus\.ytlcomms\.my|ytl-nexus\.internal|sn1lyvx1d0002\.ytlcomms\.my|10\.26\.64\.164)(:[0-9]+)?$ [NC]
    RewriteRule ^/?(.*)$ https://%1/$1 [R=301,L,NE]
    RewriteRule ^/?(.*)$ https://ytl-nexus.ytlcomms.my/$1 [R=301,L,NE]
</VirtualHost>

# ---- Port 443 ------------------------------------------------------------------
<VirtualHost *:443>
    ServerName ytl-nexus.ytlcomms.my
    ServerAlias ytl-nexus.internal sn1lyvx1d0002.ytlcomms.my 10.26.64.164

    SSLEngine on
    SSLCertificateFile    /etc/pki/nexus-ca/server.crt
    SSLCertificateKeyFile /etc/pki/nexus-ca/server.key

    # Security headers on every response, errors included (requirement 4.19).
    # Task 21: Next.js emits a per-request nonce CSP header for App Router pages.
    # setifempty preserves Next.js nonces while providing strict fallbacks for
    # Apache-served endpoints (/studio, /files, /webmail).
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always setifempty Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Header always setifempty X-Content-Type-Options "nosniff"
    Header always setifempty Referrer-Policy "strict-origin-when-cross-origin"
    Header always setifempty Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Header always setifempty X-Frame-Options "DENY"

    # Paths served by Apache itself go here, before the catch-all proxy line.
    # /studio is WordPress (Task 7, installed by `setup-wordpress`); Task 13 adds
    # /webmail and Task 12 /files the same way.
    IncludeOptional /etc/httpd/conf.d/studio.inc
    # /files is the Nexus Transfer WebClient (Task 12, `setup-sftpgo`).
    IncludeOptional /etc/httpd/conf.d/files.inc
    # /webmail is Nexus Webmail / Roundcube (Task 13, `setup-mail`).
    IncludeOptional /etc/httpd/conf.d/webmail.inc

    ProxyPreserveHost On
    # The connecting address, for the audit trail and the sign-in lockout.
    # `set` replaces any value a client sent, so it cannot be forged. The
    # application reads this header, not X-Forwarded-For, which Apache appends
    # to and whose first entry a client controls (docs/security/auth.md).
    RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Server-Sent Events: no buffering, long timeout. Routes under /api/stream/
    # are the convention for streams (Atlas, Command, AI).
    ProxyPass        /api/stream/ http://127.0.0.1:3000/api/stream/ flushpackets=on timeout=3600
    ProxyPassReverse /api/stream/ http://127.0.0.1:3000/api/stream/

    ProxyPass        / http://127.0.0.1:3000/ timeout=60
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog  logs/ytl-nexus_error.log
    CustomLog logs/ytl-nexus_access.log combined
</VirtualHost>

# ---- Loopback reader for Nexus Studio (Task 7) --------------------------------
# The Next.js server reads WordPress here, over plain HTTP on 127.0.0.1 only.
# `HTTPS on` lets WordPress offer Application Passwords, which it only allows
# over TLS. Nothing outside this machine can reach the port, and the firewall
# does not open it.
Listen 127.0.0.1:8081
<VirtualHost 127.0.0.1:8081>
    ServerName studio.localhost
    SetEnv HTTPS on
    IncludeOptional /etc/httpd/conf.d/studio.inc
    ErrorLog  logs/ytl-nexus-studio-loopback_error.log
</VirtualHost>
