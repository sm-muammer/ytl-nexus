# Prometheus configuration for Nexus Core 01 (Task 8, CMD-01).
# Installed as /etc/prometheus/prometheus.yml by `setup-monitoring`.
# Both targets are on loopback. The job name "node" is used by the allowlisted
# query node_up (lib/monitoring/queries.ts); change it there too if you rename it.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
