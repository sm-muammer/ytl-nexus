; PHP-FPM pool for Nexus Studio. Installed as /etc/php-fpm.d/wordpress.conf by
; `setup-wordpress`. Its own system user, its own socket, and a PHP that can only
; touch the WordPress folder and its temporary files.
[wordpress]
user = wordpress
group = wordpress
listen = /run/php-fpm/wordpress.sock
listen.owner = wordpress
listen.group = apache
listen.mode = 0660

pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s
pm.max_requests = 500

catch_workers_output = yes
php_admin_value[error_log] = /var/log/php-fpm/wordpress-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[open_basedir] = /var/www/studio:/var/lib/wordpress:/tmp:/usr/share/php:/etc/ssl
php_admin_value[upload_tmp_dir] = /var/lib/wordpress/tmp
php_admin_value[session.save_path] = /var/lib/wordpress/sessions
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,show_source,highlight_file
php_admin_value[expose_php] = off
php_admin_value[memory_limit] = 128M
php_admin_value[upload_max_filesize] = 16M
php_admin_value[post_max_size] = 20M
php_admin_value[allow_url_include] = off
