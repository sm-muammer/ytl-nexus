# Sandbox for SFTPGo (Task 12, TRF-01). Installed by `setup-sftpgo` as
# /etc/systemd/system/sftpgo.service.d/10-nexus.conf, on top of the package unit
# (which runs as the unprivileged user `sftpgo`). Check the result with:
#   systemd-analyze security sftpgo
[Service]
# The package unit already reads /etc/sftpgo/sftpgo.env (database password and
# signing passphrase; root only, read by systemd).
# Port 2022 needs no privileged-port capability.
AmbientCapabilities=
CapabilityBoundingSet=
ProtectSystem=strict
ReadWritePaths=/srv/nexus-transfer /var/lib/sftpgo
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
